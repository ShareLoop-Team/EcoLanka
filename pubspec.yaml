name: ecolanka
description: "ECOLANKA - Recycling & Item Sharing Platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Localization support from Flutter SDK
  flutter_localizations:
    sdk: flutter

  # Internationalization helper (commonly required when using flutter_localizations)
  intl: ^0.20.3

  # State Management for MVC Controllers
  provider: ^6.1.2

  # Backend API HTTP Requests (also used for Cloudinary image uploads)
  http: ^1.2.0

  # Firebase backend (project shareloop-c2157, free Spark plan)
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Pick photos for item posts (uploaded to Cloudinary)
  image_picker: ^1.1.2

  # GPS Proximity Search & Location Filtering
  geolocator: ^10.1.0

  # Local Storage for Tokens and Preferences
  shared_preferences: ^2.3.2

  # App UI Typography and Styling
  google_fonts: ^6.1.0
  pinput: ^6.0.2

  # Routing and Navigation
  go_router: ^18.0.1

  # Animation utilities
  flutter_animate: ^4.5.2

  # Cupertino icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/